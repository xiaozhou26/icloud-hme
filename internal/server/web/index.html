<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iCloud HME 管理台</title><link rel="stylesheet" href="/assets/app.css"></head><body>
<aside><h2>@ iCloud HME</h2><p>本地管理台</p><h3>账号 <button id="add">+</button></h3><div id="accounts"></div></aside>
<main><header><div><h1 id="title">选择账号</h1><p id="subtitle">添加或选择账号</p></div><button id="settings" disabled>账号设置</button><button id="create" disabled>创建别名</button></header>
<nav><button class="tab active" data-view="aliases">邮箱别名 <b id="aliasCount">0</b></button><button class="tab" data-view="inbox">收件箱 <b id="mailCount">0</b></button></nav>
<section id="aliases"><div class="tools"><input id="search" placeholder="搜索邮箱或标签"><button id="refreshAliases">刷新</button></div><div class="panel" id="aliasPanel"></div></section>
<section id="inbox" hidden><div class="tools"><select id="aliasFilter"><option value="">全部邮件</option></select><select id="days"><option value="1">最近 1 天</option><option value="7" selected>最近 7 天</option><option value="30">最近 30 天</option><option value="0">不限</option></select><select id="limit"><option>20</option><option>50</option><option>100</option></select><button id="refreshInbox">读取邮件</button></div><div class="panel" id="inboxPanel"></div></section></main>
<dialog id="accountModal"><form id="accountForm"><h2>添加账号</h2><label>名称<input name="name" required></label><label>Cookie<textarea name="cookies"></textarea></label><label>区域<select name="host"><option>icloud.com</option><option>icloud.com.cn</option></select></label><p><button type="button" data-close>取消</button><button>添加</button></p></form></dialog>
<dialog id="settingsModal"><div><h2>账号设置</h2><p id="settingName"></p><div class="settingTabs"><button data-setting="mailbox">收件邮箱</button><button data-setting="cookie">Cookie</button><button data-setting="password">iCloud IMAP</button></div><form id="mailboxForm" class="settingPanel"><label>邮箱服务商<select id="provider"><option value="qq">QQ 邮箱</option><option value="gmail">Gmail</option><option value="outlook">Outlook</option><option value="custom">其他</option></select></label><label>收件邮箱<input id="mailboxEmail" type="email" required placeholder="123456@qq.com"></label><label>IMAP 服务器<input id="mailboxHost" required value="imap.qq.com"></label><label>SSL 端口<input id="mailboxPort" type="number" value="993" required></label><label>邮箱授权码<input id="mailboxCode" type="password" required placeholder="不是邮箱登录密码"></label><button>验证并接入</button></form><form id="cookieForm" class="settingPanel" hidden><label>Cookie Header 或 JSON<textarea id="cookieText" required></textarea></label><button>更新 Cookie</button></form><form id="passwordForm" class="settingPanel" hidden><label>iCloud 邮箱<input id="icloudEmail" type="email" required></label><label>App 专用密码<input id="appPassword" type="password" required></label><button>验证并保存</button></form><p><button data-close>关闭</button><button id="deleteAccount" class="danger" type="button">删除账号</button></p></div></dialog>
<dialog id="messageModal"><div><h2 id="messageSubject"></h2><p id="messageDate"></p><p><b>发件人：</b><span id="messageFrom"></span></p><p><b>收件人：</b><span id="messageTo"></span></p><pre id="messageBody"></pre><p><button id="deleteMessage" class="danger">删除邮箱内邮件</button><button data-close>关闭</button></p></div></dialog><div id="toast"></div><script src="/assets/app.js"></script></body></html>
